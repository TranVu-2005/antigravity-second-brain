name: Continuous Integration & Production DevOps Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Production & Dev Dependencies
        run: npm ci

      - name: Syntax & Lint Verification
        run: node scripts/lint.js

      - name: Security & Command Injection AST Audit
        run: node scripts/security_check.js

      - name: Runtime & Container Healthcheck Verification
        run: node scripts/healthcheck.js

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high || true

  test-matrix:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    needs: [lint-and-security]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Environment & Native SQLite Support
        run: |
          node -v
          node -e "const sqlite = require('node:sqlite'); console.log('✔ Native node:sqlite available');"

      - name: Configure Git Identity for CI Runner
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Full TDD & Architecture Test Suites
        run: node test/run_all_tests.js
        env:
          NODE_ENV: test
          CI: true

  benchmark:
    name: Performance & Regression Benchmark
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Benchmark Evaluation Gate
        run: node eval/run_eval.js --compare-baseline eval/baselines/v3.8_baseline.json

  docker-verification:
    name: Docker Multi-Stage Build & Container Healthcheck
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: antigravity-second-brain:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Execution & Healthcheck
        run: |
          docker run --rm antigravity-second-brain:ci-test node scripts/healthcheck.js
